name: Leak check

# The pre-push hook's leak check, again in CI, for what the hook never sees: `git push --no-verify`, a checkout
# with no private data linked (agent worktrees, other machines: the hook then passes open), the GitHub web editor
# and merges made on GitHub. CI can't hold the private corpus, so it compares the blobs a change adds with
# corpus/leak-hashes.txt: keyed hashes (HMAC-SHA256, 64 bits) of the corpus's 8-word runs, made by the same code
# that reads text for the local check. See corpus/README.md and docs/leak-check-in-ci.html.
#
# Off until the owner sets it up; until then every run passes with a notice saying it compared nothing:
#   1. Create the key in 1Password (the generator reads it from there):
#        op item create --category password --title "beautiful-html leak-check key" --vault Private --generate-password='letters,digits,64'
#   2. Settings → Secrets and variables → Actions → Secrets: BH_LEAK_KEY = that password, or
#        op read "op://Private/beautiful-html leak-check key/password" | gh secret set BH_LEAK_KEY --repo newhoggy/bitwise-blog
#   3. With the private data linked: npm run advisor -- leak-hashes, then commit corpus/leak-hashes.txt.
#   4. Run this workflow once from main (Actions → Leak check → Run workflow) to check all of main's history.
#
# Never use `pull_request_target` here: it would run with the secret on code from a fork. A pull request from a
# fork gets no secrets, so it skips; the push to main that merges it is checked.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-check:
    name: Leak check (keyed hashes)
    runs-on: ubuntu-latest
    # Normally under a minute; a full-history run (workflow_dispatch, or a force push) a little longer.
    timeout-minutes: 10
    steps:
      # Full history, so the base of the range is here and a blob is read only if the change adds it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The advisor tools read YAML, a pinned devDependency.
      - name: Install dependencies
        run: npm ci

      # pull_request: what the PR's commits add to its base. push: what the push adds (everything reachable when
      # `before` is zero or unknown here, such as after a force push). workflow_dispatch: everything reachable.
      - name: Compare the blobs this change adds with the hash list
        env:
          BH_LEAK_KEY: ${{ secrets.BH_LEAK_KEY }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) set -- --head "$PR_HEAD" --base "$PR_BASE" ;;
            push) set -- --head "$GITHUB_SHA" --base "$BEFORE" ;;
            *) set -- --head "$GITHUB_SHA" ;;
          esac
          node scripts/advisor.mts leak-check --hashed "$@"
